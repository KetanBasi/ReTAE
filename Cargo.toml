# SECTION: Workspace
[workspace]
resolver = "3"
members = [
    "crates/audio-types",
    "crates/audio-engine",
    "crates/net-vban",
    "crates/platform-io",
    "crates/app-core",
    "crates/routerd",
    "crates/router-ui",
    "crates/router-cli",
    "crates/router-tray",
    "crates/android-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# ? Versions are pinned once here; member crates say `dep.workspace = true`.
# ? Each session adds only the crates it actually uses (see PLAN.md §10 for the full list).
[workspace.dependencies]
# * Workspace crates
audio-types = { path = "crates/audio-types" }
audio-engine = { path = "crates/audio-engine" }

# * External crates
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
rtrb = "0.4.1"
assert_no_alloc = "1.1.2"
# ? Dev-only: the S2 benchmark compares our resampler with rubato's cubic one. 4.0.x is the
# ? newest release that builds on the workspace `rust-version`; the FFT resamplers are not needed.
rubato = { version = "4.0.0", default-features = false }
# * S3 (net-vban). socket2: buffer sizes, SO_REUSEADDR, IP_TOS, broadcast. mdns-sd: pure Rust.
socket2 = { version = "0.6.5", features = ["all"] }
mdns-sd = "0.21.7"
# ? Opus is the only C dependency in the workspace and is optional (CLAUDE.md law 3).
opus = "0.4.0"
# * S4 (control plane). postcard: compact serde wire format for the IPC protocol.
# * interprocess: local sockets (abstract namespace on Linux, named pipe on Windows).
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
interprocess = "2.4.7"
net-vban = { path = "crates/net-vban" }
platform-io = { path = "crates/platform-io" }
app-core = { path = "crates/app-core" }
routerd = { path = "crates/routerd" }
# * S5 (Linux backends). All three bind C libraries (libpipewire, ALSA, libdbus), so they are
# * optional features of platform-io and the default workspace build needs none of them.
# ? v0_3_49 gives `Buffer::requested` (how many frames the graph wants this cycle; a playback
# ? stream must not fill a bigger buffer than that) and `target.object`. It sets the minimum
# ? PipeWire at run time to 0.3.49, so Ubuntu 22.04 (0.3.48) is not supported; 24.04 is.
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
cpal = { version = "0.18.2", default-features = false }
audio_thread_priority = "0.38.0"
# ? Windows-only: qWAVE QoS (IP_TOS is ignored by the Windows stack). Raw FFI, no `windows` crate.
windows-sys = "0.61.2"
# * S6 (Windows). `wasapi` wraps WASAPI incl. IAudioClient3 and process loopback; it is pure Rust
# * (no C toolchain). tray-icon without default features: those only add GTK/xdo on Linux.
wasapi = "0.26.0"
tray-icon = { version = "0.24.2", default-features = false }
# * S7 (desktop UI). glow renderer, not wgpu (lighter for a 2D mixer, PLAN §6.4).
# ? 0.32.3 is the newest eframe/egui that builds on the workspace `rust-version` (1.85); 0.33+
# ? need 1.88 and 0.37 needs 1.95. Same rule as `rubato` above. Bumping it later is a version edit
# ? plus whatever API moved. `accesskit` is needed by the headless tests (egui_kittest finds widgets
# ? through it) and egui-winit fails to build if egui has it and eframe does not.
egui = { version = "0.32.3", default-features = false }
eframe = { version = "0.32.3", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland"] }
egui_kittest = "0.32.3"
# !SECTION: Workspace

# SECTION: Profiles
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# ? Keeps symbol names + line numbers in release binaries so profilers/backtraces are readable.
debug = "line-tables-only"
# !SECTION: Profiles
